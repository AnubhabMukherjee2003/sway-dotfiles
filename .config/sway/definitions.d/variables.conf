# Functional Sway variables. Theme colors remain in themes/active.conf.

set $mod Mod4
set $alt_mod Mod1

set $term foot
set $term_cwd foot --working-directory "$HOME"
set $menu wofi --show drun
set $clipboard cliphist list | wofi --dmenu | cliphist decode | wl-copy

set $volume_up wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
set $volume_down wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
set $volume_mute wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
set $mic_mute wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
set $brightness_up brightnessctl set 5%+
set $brightness_down brightnessctl set 5%-
set $shutdown systemctl poweroff

set $left Left
set $down Down
set $up Up
set $right Right
set $left_alt h
set $down_alt j
set $up_alt k
set $right_alt l

set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5
set $ws6 6
set $ws7 7
set $ws8 8
set $ws9 9
set $ws10 10
set $focus_after_move true

set $locking swaylock
set $purge_cliphist_logout true
set $screenshot_screen grim
set $screenshot_selection grim -g "$(slurp)"
set $screenshot_screen_upload $screenshot_screen
set $screenshot_selection_upload $screenshot_selection
set $scale_up swaymsg output '*' scale 1.25
set $scale_down swaymsg output '*' scale 1
set $scale_default swaymsg output '*' scale 1
set $task_manager foot -e htop
set $emoji_picker wofi --show dmenu
set $help true