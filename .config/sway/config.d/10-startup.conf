# User environment and session bootstrap
# Keep the session environment loaded for spawned commands.
exec systemctl --user import-environment DISPLAY XDG_SESSION_TYPE WAYLAND_DISPLAY SWAYSOCK
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK

# Let user services manage long-running daemons, rather than launching
# additional copies from the Sway config itself.
