# Utility windows should float and stay easy to dismiss.
for_window [app_id="floating_shell"] floating enable, move position center
for_window [class="(?i)pinentry"] floating enable, move position center
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [title="(?i)picture-in-picture"] floating enable

# Keep splash and installer dialogs from stealing focus.
for_window [class="(?i)nm-connection-editor"] floating enable
