# Dracula theme for Sway
# Colors inspired by https://draculatheme.com/

# Font and appearance theme variables
set $gtk-theme Adwaita-dark
set $icon-theme Papirus-Dark
set $cursor-theme Adwaita
set $gui-font Cantarell 10
set $term-font Monospace 10
set $gtk-color-scheme prefer-dark
set $kvantum-theme Dracula

# Dracula color palette
set $color0  #282a36  # background
set $color1  #f8f8f2  # foreground
set $color2  #44475a  # selection
set $color3  #6272a4  # comment

# Theme semantic colors
set $background-color #282a36
set $text-color #f8f8f2
set $selection-color #44475a
set $accent-color #bd93f9  # purple

# Dracula extended palette
set $red     #ff5555
set $green   #50fa7b
set $yellow  #f1fa8c
set $blue    #8be9fd
set $magenta #bd93f9
set $cyan    #8be9fd

# Window colors
# Property Name         Border         BG             Text           Indicator      Child Border
client.focused          $accent-color  $accent-color  $background-color $accent-color $accent-color
client.focused_inactive $color2        $color2        $text-color    $color2        $color2
client.unfocused        $color0        $color0        $text-color    $color0        $color0
client.urgent           $red           $red           $text-color    $red           $red
client.placeholder      $color0        $color0        $text-color    $color0        $color0
client.background       $text-color
